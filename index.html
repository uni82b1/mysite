<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        /* 全体のリセットとベース設定 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            /* 背景のグラデーション（お好みで変更してください） */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); 
            color: #333;
            min-height: 100vh;
        }

        /* スマホ風の幅に制限するコンテナ（PCで見ても中央にスマホサイズで表示されます） */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }

        /* プロフィール画像 */
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%; /* 丸くする */
            object-fit: cover;
            border: 3px solid #fff; /* 白いフチドリ */
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); /* 軽い影 */
            margin-bottom: 15px;
        }

        /* 名前 */
        .profile-name {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 10px 0;
        }

        /* 自己紹介文 */
        .profile-bio {
            font-size: 14px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* リンクボタンのまとまり */
        .link-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 15px; /* ボタン同士の隙間 */
        }

        /* 個別のリンクボタン */
        .link-btn {
            display: block;
            background-color: #fff; /* ボタンの背景色 */
            color: #333;
            text-decoration: none; /* 下線を消す */
            padding: 18px 20px;
            border-radius: 30px; /* Lit.Link風の角丸 */
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); /* ボタンの影 */
            transition: transform 0.2s, box-shadow 0.2s; /* アニメーション設定 */
        }

        /* ボタンを押そうとした時（ホバー時）の動き */
        .link-btn:hover {
            transform: translateY(-2px); /* 少し上に浮く */
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            background-color: #fafafa;
        }

        /* 丸いリンクボタンのまとまり */
        .circle-links {
            display: flex;
            justify-content: center; /* 中央揃え */
            gap: 25px; /* 丸ボタン同士の隙間 */
            margin-bottom: 30px; /* 下の縦並びリストとの余白 */
        }

        /* 個別の丸いボタン */
        .circle-btn {
            display: flex; /* 文字を上下左右の中央にするための準備 */
            align-items: center; /* 上下の中央揃え */
            justify-content: center; /* 左右の中央揃え */
            width: 60px; /* 丸の幅 */
            height: 60px; /* 丸の高さ（幅と同じ値にする） */
            background-color: #fff; /* ボタンの背景色 */
            color: #333; /* 文字色 */
            text-decoration: none; /* 下線を消す */
            border-radius: 50%; /* 完全な丸にする魔法のコード */
            font-weight: bold;
            font-size: 24px; /* 文字の大きさ */
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); /* ボタンの影 */
            transition: transform 0.2s, box-shadow 0.2s; /* アニメーション */
        }

        /* 丸ボタンをホバーした時の動き */
        .circle-btn:hover {
            transform: translateY(-2px); /* 少し上に浮く */
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            background-color: #fafafa;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- リンク集部分 -->
        <!-- href="#" の # を飛ばしたいURLに変更してください -->
        <!-- 丸いアイコンリンク部分 -->
        <div class="circle-links">
            <!-- target="_blank" と rel="noopener noreferrer" で安全に新規タブで開きます -->
            <a href="https://x.com/U_82B1" target="_blank" rel="noopener noreferrer" class="circle-btn">X</a>
            <a href="https://www.youtube.com/@U_82B1" target="_blank" rel="noopener noreferrer" class="circle-btn">Y</a>
            <a href="https://zeta-ai.io/@KneePillow3333?share_id=u5rlpmsj" target="_blank" rel="noopener noreferrer" class="circle-btn">Z</a>
        </div>
    </div>

</body>
</html>
